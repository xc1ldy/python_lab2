[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "streamstats"
version = "0.1.0"
description = "Потоковый анализатор файлов событий"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.27.3",
    "pydantic>=2.14.1",
]

[project.scripts]
streamstats = "streamstats.__main__:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "mypy>=2.4.0",
    "pre-commit",
]

[tool.hatch.build.targets.wheel]
packages = ["src/streamstats"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]